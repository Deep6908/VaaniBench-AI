[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "vaanibench"
version = "0.1.0"
description = "Reproducible conversational AI evaluation and observability"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "opentelemetry-sdk>=1.30,<2"]

[project.scripts]
vaanibench = "vaanibench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/vaanibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--basetemp=.pytest-tmp"]
