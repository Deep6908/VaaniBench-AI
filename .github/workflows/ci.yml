name: Evaluation quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.6
      - name: Install locked environment
        run: uv sync --locked
      - name: Unit and integration tests
        run: uv run --no-sync pytest -q
      - name: Validate versioned dataset
        run: uv run --no-sync vaanibench validate
      - name: Run offline baseline and candidate
        run: |
          uv run --no-sync vaanibench run --config configs/mock-baseline.json --out artifacts/baseline
          uv run --no-sync vaanibench run --config configs/mock-baseline.json --out artifacts/candidate
          uv run --no-sync vaanibench compare --baseline artifacts/baseline/run.json --candidate artifacts/candidate/run.json --thresholds configs/thresholds.json --out artifacts/pass-gate
      - name: Prove known regression is blocked
        shell: bash
        run: |
          uv run --no-sync vaanibench run --config configs/mock-degraded.json --out artifacts/degraded
          set +e
          uv run --no-sync vaanibench compare --baseline artifacts/baseline/run.json --candidate artifacts/degraded/run.json --thresholds configs/thresholds.json --out artifacts/fail-gate
          result=$?
          set -e
          test "$result" -eq 2
      - name: Retain sanitized mock artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-evaluation-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 7
